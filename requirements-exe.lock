# requirements-exe.lock — pinned EXE build dependencies (reproducible builds)
#
# Generated 2026-11-09 by installing requirements-exe.txt in a fresh venv
# (Python 3.12.3, Linux) and running `pip freeze`. The same version set was
# verified by the full pytest suite + smoke test (see CHANGES_PERF_OPT_0_5_2.md).
# Direct deps are the packages listed in requirements-exe.txt; the rest are
# their transitive deps at install time.
#
# How to use:
#   pip install -r requirements-exe.lock        # reproducible build (CI + local)
#   pip install -r requirements-exe.txt         # floating (>=) — only when
#                                               # deliberately upgrading deps
# After upgrading, re-freeze and re-run the test suite before committing a
# new lock. Re-lock roughly quarterly so the pin does not go stale.
# NOTE: versions were resolved on Linux cp312; all of them ship win_amd64
# wheels too (fastapi/pandas/numpy/uvicorn stack), so the lock installs on
# the Windows build machine / GitHub windows-latest runner as well.
# Excluded from the freeze: pytest and its test-only deps (iniconfig, pluggy,
# Pygments) — tests install pytest separately.
# Update 2026-11-09 (report items 11-12): uvloop / httptools / watchfiles
# dropped with plain uvicorn; PyYAML went with uvicorn[standard] (nothing in
# the app imports yaml). APScheduler 3.10.4 added (with tzlocal + pytz) so the
# EXE restores external-data auto-refresh.
