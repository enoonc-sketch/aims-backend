# TLS 终止 + 反向代理。证书放在 deploy/certs/{fullchain.pem,privkey.pem}(由你提供, 例如 Let's Encrypt)。
# 应用本身拒绝明文 HTTP, 这里负责 80 -> 443 跳转、把 X-Forwarded-Proto 告诉后端。
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    # 略大于 UPLOAD_MAX_BYTES(20MB): 超大请求在这里就被挡住, 不进入应用
    client_max_body_size 25m;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 用 $remote_addr 覆盖而不是追加: 不让客户端自带的 X-Forwarded-For 混进来(登录限流按这个 IP 计数)
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
